---
- name: Deploy ChefOps to NCSU VM (No Sudo - Rolling Deployment)
  hosts: vcl
  become: no
  vars_files:
    - ../vars/main.yml

  tasks:
    - name: Log in to GitHub Container Registry
      command: >
        docker login {{ ghcr_registry }}
        -u {{ ghcr_username }}
        -p {{ ghcr_token }}
      no_log: true

    - name: Pull latest backend image
      command: docker pull {{ backend_image }}

    - name: Pull latest frontend image
      command: docker pull {{ frontend_image }}

    # BACKEND DEPLOYMENT
    - name: Stop existing backend container
      command: docker stop {{ backend_container_name }}
      ignore_errors: yes

    - name: Remove existing backend container
      command: docker rm {{ backend_container_name }}
      ignore_errors: yes

    - name: Deploy new backend container
      command: >
        docker run -d
        --name {{ backend_container_name }}
        --network {{ docker_network }}
        -p 3000:3000
        -e NODE_ENV=production
        -e PORT=3000
        --restart unless-stopped
        {{ backend_image }}

    - name: Wait for backend health check
      uri:
        url: "http://localhost:3000/health"
        status_code: 200
      register: health_check
      until: health_check.status == 200
      retries: "{{ health_check_retries }}"
      delay: "{{ health_check_delay }}"

    # FRONTEND DEPLOYMENT
    - name: Stop existing frontend container
      command: docker stop {{ frontend_container_name }}
      ignore_errors: yes

    - name: Remove existing frontend container
      command: docker rm {{ frontend_container_name }}
      ignore_errors: yes

    - name: Deploy new frontend container
      command: >
        docker run -d
        --name {{ frontend_container_name }}
        --network {{ docker_network }}
        -p 80:8080
        --restart unless-stopped
        {{ frontend_image }}

    - name: Wait for frontend to start
      pause:
        seconds: 5

    # CLEANUP
    - name: Clean up dangling images
      command: docker image prune -f

    - name: Display deployment success message
      debug:
        msg: |
          ✅ Deployment successful!
          
          🌐 Access your application:
          - Frontend: http://{{ ansible_host }}
          - Backend API: http://{{ ansible_host }}:3000
          - Health Check: http://{{ ansible_host }}:3000/health
          
          📝 From off-campus, remember to:
          - Connect to NC State VPN first, OR
          - SSH through remote-linux.eos.ncsu.edu