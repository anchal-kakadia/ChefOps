---
# Application configuration (in your home directory - no sudo needed)
app_directory: /home/akakadi/chefops
docker_network: chefops-network

# Backend / Frontend images (overridden via CLI)
backend_image: "{{ backend_image | default('ghcr.io/akakadi/chefops-backend:latest') }}"
frontend_image: "{{ frontend_image | default('ghcr.io/akakadi/chefops-frontend:latest') }}"

# Production configuration
production_backend_container_name: chefops-backend
production_backend_port: 3000
production_frontend_container_name: chefops-frontend
production_frontend_port: 80

# Staging configuration (blue environment - different ports)
staging_backend_container_name: chefops-backend-staging
staging_backend_port: 3001
staging_frontend_container_name: chefops-frontend-staging
staging_frontend_port: 8081

# GitHub Container Registry
ghcr_registry: ghcr.io
ghcr_username: "{{ ghcr_username }}"
ghcr_token: "{{ ghcr_token }}"

# Deployment strategy
deployment_strategy: blue_green
deploy_target: "{{ deploy_target | default('staging') }}"
health_check_retries: 5
health_check_delay: 5

# NO SUDO - all operations run as regular user
ansible_become: no