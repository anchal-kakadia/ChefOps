name: ChefOps CI/CD Pipeline

on:
  push:
    branches: [ main, release ]
  pull_request:
    branches: [ main, release ]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE_NAME: ${{ github.repository }}/chefops-backend
  FRONTEND_IMAGE_NAME: ${{ github.repository }}/chefops-frontend

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run ESLint
        working-directory: ./backend
        run: npm run lint

      - name: Run Jest tests
        working-directory: ./backend
        run: npm test -- --coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          directory: ./backend/coverage
          flags: backend
          fail_ci_if_error: false

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release')
    permissions:
      contents: read
      packages: write
    outputs:
      backend_image: ${{ steps.image-tags.outputs.backend_image }}
      frontend_image: ${{ steps.image-tags.outputs.frontend_image }}
      deploy_target: ${{ steps.deploy-context.outputs.deploy_target }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine deployment context
        id: deploy-context
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "deploy_target=production" >> "$GITHUB_OUTPUT"
            echo "image_tag=prod-latest" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_target=staging" >> "$GITHUB_OUTPUT"
            echo "image_tag=staging-latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Set image tags
        id: image-tags
        run: |
          echo "backend_image=${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "frontend_image=${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.image-tags.outputs.backend_image }}
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${{ steps.deploy-context.outputs.image_tag }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.image-tags.outputs.frontend_image }}
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ steps.deploy-context.outputs.image_tag }}
          build-args: |
            VITE_API_URL=${{ secrets.PRODUCTION_API_URL || 'http://localhost:3000/api' }}

  deploy:
    name: Deploy to NCSU VCL
    runs-on: self-hosted  # This runs ON the NCSU VM, no SSH needed!
    needs: build-and-push
    if: needs.build-and-push.result == 'success'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Ansible installation
        id: check-ansible
        run: |
          if command -v ansible-playbook &> /dev/null; then
            echo "installed=true" >> "$GITHUB_OUTPUT"
          else
            echo "installed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Ansible
        if: steps.check-ansible.outputs.installed == 'false'
        run: |
          pip3 install --user ansible
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Ensure Ansible in PATH
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          ansible-playbook --version

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull images
        run: |
          docker pull ${{ needs.build-and-push.outputs.backend_image }}
          docker pull ${{ needs.build-and-push.outputs.frontend_image }}

      - name: Deploy with Ansible
        working-directory: ./ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: False
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          
          ansible-playbook playbooks/deploy.yml \
            -i inventory.ini \
            -e "deploy_target=${{ needs.build-and-push.outputs.deploy_target }}" \
            -e "ghcr_token=${{ secrets.GITHUB_TOKEN }}" \
            -e "ghcr_username=${{ github.actor }}" \
            -e "backend_image=${{ needs.build-and-push.outputs.backend_image }}" \
            -e "frontend_image=${{ needs.build-and-push.outputs.frontend_image }}"

      - name: Post deployment notification
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Deployment to ${{ needs.build-and-push.outputs.deploy_target }} successful!"
          else
            echo "❌ Deployment to ${{ needs.build-and-push.outputs.deploy_target }} failed!"
          fi

  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [lint-and-test, build-and-push, deploy]
    if: always()
    
    steps:
      - name: Deployment Status
        run: |
          echo "Pipeline Status: ${{ job.status }}"
          echo "Lint & Test: ${{ needs.lint-and-test.result }}"
          echo "Build & Push: ${{ needs.build-and-push.result }}"
          echo "Deploy: ${{ needs.deploy.result }}"