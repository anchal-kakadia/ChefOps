name: ChefOps CI/CD Pipeline

on:
  push:
    branches: [ main, release, development ]
  pull_request:
    branches: [ main, release, development ]

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Lint backend
        working-directory: ./backend
        run: npm run lint

      - name: Test backend
        working-directory: ./backend
        run: npm test

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint frontend
        working-directory: ./frontend
        run: npm run lint

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/release' || github.ref == 'refs/heads/main')
    permissions:
      contents: read
      packages: write
    outputs:
      backend_image: ${{ steps.image-tags.outputs.backend_image }}
      frontend_image: ${{ steps.image-tags.outputs.frontend_image }}
      deploy_target: ${{ steps.deploy-context.outputs.deploy_target }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log into GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Determine deployment context
        id: deploy-context
        shell: bash
        run: |
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            echo "latest_tag=prod-latest" >> "$GITHUB_OUTPUT"
            echo "deploy_target=production" >> "$GITHUB_OUTPUT"
          else
            echo "latest_tag=release-latest" >> "$GITHUB_OUTPUT"
            echo "deploy_target=staging" >> "$GITHUB_OUTPUT"
          fi

      - name: Set image tags
        id: image-tags
        shell: bash
        run: |
          echo "backend_image=ghcr.io/${{ github.repository_owner }}/chefops-backend:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "frontend_image=ghcr.io/${{ github.repository_owner }}/chefops-frontend:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image-tags.outputs.backend_image }}
            ghcr.io/${{ github.repository_owner }}/chefops-backend:${{ steps.deploy-context.outputs.latest_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_API_URL=http://csc519-109-host.csc.ncsu.edu:3000/api
          tags: |
            ${{ steps.image-tags.outputs.frontend_image }}
            ghcr.io/${{ github.repository_owner }}/chefops-frontend:${{ steps.deploy-context.outputs.latest_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to NCSU VM
    runs-on: self-hosted
    needs: build-and-push
    if: needs.build-and-push.result == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull backend image
        run: docker pull ghcr.io/${{ github.repository_owner }}/chefops-backend:latest

      - name: Deploy with Ansible
        working-directory: ./ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: False
        run: |
          ansible-playbook playbooks/deploy.yml -i inventory.ini \
            -e "deploy_target=${{ needs.build-and-push.outputs.deploy_target }}" \
            -e "ghcr_username=${{ github.actor }}" \
            -e "ghcr_token=${{ secrets.GITHUB_TOKEN }}" \
            -e "backend_image=${{ needs.build-and-push.outputs.backend_image }}" \
            -e "frontend_image=${{ needs.build-and-push.outputs.frontend_image }}"
