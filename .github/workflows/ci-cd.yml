name: ChefOps CI/CD Pipeline

on:
  push:
    branches: [ main, release, development ]
  pull_request:
    branches: [ main, release ]

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Lint backend
        working-directory: ./backend
        run: npm run lint

      - name: Test backend
        working-directory: ./backend
        run: npm test

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint frontend
        working-directory: ./frontend
        run: npm run lint

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/release'
    
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/chefops-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_API_URL=http://csc519-109-host.csc.ncsu.edu:3000/api
          tags: ghcr.io/${{ github.repository_owner }}/chefops-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to NCSU VM
    runs-on: self-hosted  # ← Changed from ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/release'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull and deploy backend
        run: |
          docker pull ghcr.io/${{ github.repository_owner }}/chefops-backend:latest
          docker stop chefops-backend || true
          docker rm chefops-backend || true
          docker run -d --name chefops-backend --network chefops-network -p 3000:3000 \
            -e NODE_ENV=production -e PORT=3000 --restart unless-stopped \
            ghcr.io/${{ github.repository_owner }}/chefops-backend:latest

      - name: Pull and deploy frontend
        run: |
          docker pull ghcr.io/${{ github.repository_owner }}/chefops-frontend:latest
          docker stop chefops-frontend || true
          docker rm chefops-frontend || true
          docker run -d --name chefops-frontend --network chefops-network -p 80:8080 \
            --restart unless-stopped \
            ghcr.io/${{ github.repository_owner }}/chefops-frontend:latest

      - name: Clean up old images
        run: docker image prune -f