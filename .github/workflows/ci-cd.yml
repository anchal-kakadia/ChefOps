name: ChefOps CI/CD Pipeline

on:
  push:
    branches: [ main, release, development ]
  pull_request:
    branches: [ main, release ]

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Lint backend
        working-directory: ./backend
        run: npm run lint

      - name: Test backend
        working-directory: ./backend
        run: npm test

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint frontend
        working-directory: ./frontend
        run: npm run lint

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/release'
    
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/chefops-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          platforms: linux/amd64
          push: true
          build-args: |
            VITE_API_URL=http://csc519-109-host.csc.ncsu.edu:3000/api
          tags: ghcr.io/${{ github.repository_owner }}/chefops-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to NCSU VM
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/release'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.VCL_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H csc519-109-host.csc.ncsu.edu >> ~/.ssh/known_hosts

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: Create Ansible inventory dynamically
        working-directory: ./ansible
        run: |
          cat > inventory.ini << EOF
          [vcl]
          csc519-109-host.csc.ncsu.edu ansible_user=akakadi ansible_ssh_private_key_file=~/.ssh/id_rsa
          
          [vcl:vars]
          ansible_python_interpreter=/usr/bin/python3
          ansible_become=no
          EOF
          echo "Created inventory:"
          cat inventory.ini

      - name: Test SSH Connection
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa akakadi@csc519-109-host.csc.ncsu.edu "echo 'SSH connection successful'"

      - name: Deploy with Ansible
        working-directory: ./ansible
        run: |
          ansible-playbook playbooks/deploy.yml -i inventory.ini \
            -e "ghcr_username=${{ github.actor }}" \
            -e "ghcr_token=${{ secrets.GITHUB_TOKEN }}" \
            -e "backend_image=ghcr.io/${{ github.repository_owner }}/chefops-backend:latest" \
            -e "frontend_image=ghcr.io/${{ github.repository_owner }}/chefops-frontend:latest"
        env:
          ANSIBLE_HOST_KEY_CHECKING: False